# Testa e publica as regras e os índices do Firebase (firestore.rules,
# firestore.indexes.json, storage.rules) a cada push na main que os altere.
# O site em si é publicado pelo Netlify.
#
# Segredo necessário (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT: JSON da conta de serviço com os papéis
#   Firebase Rules Admin, Cloud Datastore Index Admin e Service Usage Consumer.
name: Regras do Firebase

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - tests/regras/**
      - .github/workflows/firebase-regras.yml
  workflow_dispatch:

# Um deploy por vez; um push novo espera o anterior terminar
concurrency:
  group: firebase-regras
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:rules

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Credencial da conta de serviço
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Segredo FIREBASE_SERVICE_ACCOUNT não configurado"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/conta-servico.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/conta-servico.json" >> "$GITHUB_ENV"
      # Sem --force: índices que existem só no Firebase não são apagados
      - run: npx firebase deploy --only firestore:rules,firestore:indexes,storage --non-interactive
      - if: always()
        run: rm -f "$RUNNER_TEMP/conta-servico.json"
